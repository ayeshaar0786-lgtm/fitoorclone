<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Fitoor</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <div class="topbar">
    <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="https://twitter.com/" target="_blank" aria-label="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
    <a href="https://www.linkedin.com/" target="_blank" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
    <a href="https://www.pinterest.com/YOUR_PINTEREST" target="_blank" aria-label="Pinterest"><i class="fa-brands fa-pinterest-p"></i></a>
    <a href="https://wa.me/YOUR_NUMBER" target="_blank" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
  </div>

  <header class="site-header">
    <a href="/" class="logo"><img src="/images/logo.png" alt="Fitoor logo"></a>
    <nav class="main-nav">
      <a href="/">Home</a>
      <a href="/shop.html">Shop</a>
      <a href="/about.html">About Us</a>
      <a href="/contact.html" class="active">Contact Us</a>
    </nav>
  </header>

  <nav class="category-nav">
    <a href="/shop.html?category=Paintings">Paintings</a>
    <a href="/shop.html?category=Drawings">Drawings</a>
    <a href="/shop.html?category=Mandalas">Mandalas</a>
    <a href="/shop.html?category=Calligraphy">Calligraphy</a>
  </nav>

  <main class="content">
    <h1>Contact Us</h1>
    <p>Have a question about a painting? Send us a message and we will get back to you.</p>

    <form id="contact-form">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="Your email" required>
      <textarea name="message" placeholder="Your message" required></textarea>
      <button class="btn" type="submit">Send Message</button>
    </form>
    <p class="form-msg" id="msg">Thank you! Your message has been received.</p>
  </main>

  <footer class="site-footer">
    <p>© 2026 Fitoor. All rights reserved.</p>
    <p><a href="/about.html">About Us</a> · <a href="/contact.html">Contact Us</a></p>
  </footer>

  <script>
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("msg").style.display = "block";
      e.target.reset();
    });
  </script>
</body>
</html>
